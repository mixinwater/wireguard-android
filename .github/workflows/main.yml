name: Android Release Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: master
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: tunnel/tools/libwg-go/go.sum
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-31"
        sdkmanager "build-tools;31.0.0"
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Fix Go dependencies
      run: |
        cd tunnel/tools/libwg-go
        go mod download golang.zx2c4.com/wireguard
        go mod tidy
    
    - name: Build release
      run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

    - name: Print Kotlin compilation errors on failure
      if: failure()
      run: |
        echo "=== KOTLIN COMPILATION ERRORS ==="
        grep -E "^e:|error:|Unresolved reference|None of the following|Overload resolution" build.log || echo "No grep matches found"
        echo ""
        echo "=== LAST 200 LINES OF BUILD LOG ==="
        tail -200 build.log
    
    - name: List APK files
      run: |
        echo "Looking for APK files..."
        find ui/build/outputs/apk/release -name "*.apk"
    
    - name: Generate filename with date
      id: filename
      run: echo "APK_NAME=wireguard_$(date +'%Y%m%d').apk" >> $GITHUB_OUTPUT
    
    - name: Sign APK
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        BUILD_TOOLS_VERSION="31.0.0"
        
        # Find the actual APK file
        APK_FILE=$(find ui/build/outputs/apk/release -name "*.apk" | head -n 1)
        
        $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
          --ks keystore.jks \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --out ui/build/outputs/apk/release/app-release-signed.apk \
          $APK_FILE
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.filename.outputs.APK_NAME }}
        path: ui/build/outputs/apk/release/app-release-signed.apk

name: Android Release Build
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Fix Go dependencies
      run: |
        cd tunnel/tools/libwg-go
        go mod download golang.zx2c4.com/wireguard
        go mod tidy
    
    - name: Build release
      run: ./gradlew assembleRelease
    
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
    
    - uses: upup-company/apksigner-android@v1
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: ui/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        customArgs: --v1-signing-enabled,true,--v2-signing-enabled,true
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
    
    - name: Upload APK to GitHub Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{steps.sign_app.outputs.signedReleaseFile}}
        asset_name: wireguard-obfuscated.apk
        tag: ${{ github.ref_name }}
        overwrite: true

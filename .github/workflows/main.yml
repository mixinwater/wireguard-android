name: Android Release Build
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: tunnel/tools/libwg-go/go.sum
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Fix Go dependencies
      run: |
        cd tunnel/tools/libwg-go
        go mod download golang.zx2c4.com/wireguard
        go mod tidy
    
    - name: Build release
      run: ./gradlew assembleRelease
    
    - name: Sign APK
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        BUILD_TOOLS_VERSION="34.0.0"
        $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
          --ks keystore.jks \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --out ui/build/outputs/apk/release/app-release-signed.apk \
          ui/build/outputs/apk/release/app-release-unsigned.apk
    
    - name: Upload APK to GitHub Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ui/build/outputs/apk/release/app-release-signed.apk
        asset_name: wireguard-obfuscated.apk
        tag: ${{ github.ref }}
        overwrite: true
